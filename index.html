<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Sederhana</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#1877f2,#42a5f5,#0d47a1);
}

.login-box{
    width:350px;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    animation:zoom 0.8s ease;
}

@keyframes zoom{
    from{
        transform:scale(0.7);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

.logo{
    text-align:center;
    font-size:35px;
    color:#1877f2;
    font-weight:bold;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:14px;
    margin:8px 0;
    border:1px solid #ddd;
    border-radius:10px;
    outline:none;
    font-size:16px;
}

input:focus{
    border-color:#1877f2;
}

button{
    width:100%;
    padding:14px;
    border:none;
    background:#1877f2;
    color:white;
    font-size:18px;
    border-radius:10px;
    cursor:pointer;
    margin-top:10px;
}

button:hover{
    background:#0d65d9;
}

.info{
    text-align:center;
    margin-top:15px;
    color:#666;
    font-size:14px;
}

.success{
    color:green;
    text-align:center;
    margin-top:10px;
    font-weight:bold;
}
</style>
</head>
<body>

<div class="login-box">
    <div class="logo">Login</div>

    <input type="text" id="username" placeholder="Masukkan Username">
    <input type="password" id="password" placeholder="Masukkan Password">

    <button onclick="login()">Masuk</button>

    <div class="info">Username: admin | Password: 12345</div>
    <div class="success" id="hasil"></div>
</div>

<script>
function login(){
    let user = document.getElementById("username").value;
    let pass = document.getElementById("password").value;
    let hasil = document.getElementById("hasil");

    if(user=="admin1" && pass=="12345"){
        hasil.innerHTML="Login Berhasil ✅";
    }else{
        hasil.innerHTML="Username / Password Salah ❌";
        hasil.style.color="red";
    }
}
</script>

</body>
</html>
